.pv-tagline{font-family:var(--serif);font-style:italic;font-size:clamp(16px,4vw,20px);color:var(--silver);margin:8px 0 4px;text-align:center}
.pv-landing-copy{font-size:15.5px;color:#c9c3d6;max-width:620px;margin:6px auto 0;text-align:center}

.pv-landing-foot{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--silver-2)}

.pv-feature-grid{grid-template-columns:1fr}

/* ---------- loja Tenkhyrons (visual de apresentação) ---------- */
.store-hero{text-align:center;padding:30px 22px;background:radial-gradient(circle at 90% 10%,rgba(124,58,237,.35),transparent 45%),linear-gradient(145deg,#15101f,#07050c);border-color:rgba(167,139,250,.4)}
.store-mark{font-size:44px;filter:drop-shadow(0 0 18px var(--violet))}
.store-kicker{display:block;color:var(--violet-2);font-size:11px;letter-spacing:.24em;font-weight:700;margin:6px 0}
.store-balance{display:grid;gap:4px;justify-items:center;margin-top:18px;padding:14px;border-radius:16px;background:rgba(4,3,7,.5);border:1px solid var(--line)}
.store-balance span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.store-balance b{font-family:var(--serif);font-size:20px;color:var(--silver)}
.store-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.store-section-head h2{margin:2px 0 0}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.store-item{margin:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.store-item p{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.store-item h3{margin:6px 0 0;font-size:17px}
.store-art{width:100%;height:86px;border-radius:16px;display:grid;place-items:center;font-size:36px;color:var(--silver);
  background:radial-gradient(circle at 50% 30%,rgba(167,139,250,.35),transparent 60%),rgba(4,3,7,.6);border:1px solid var(--line);margin-bottom:4px}
.store-art.crystal{color:var(--violet-2)}
.store-art.crest,.store-art.relic-art{color:var(--silver)}
.store-art.title-art{color:var(--violet-2)}
.store-art.frame-art{color:#e9d5ff}
.store-art.crown-art{color:#f5f3ff;filter:drop-shadow(0 0 12px rgba(196,181,253,.8))}
.store-art.potion-art{color:#f0abfc}
.store-rarity{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--silver)}
.store-rarity.common{color:var(--silver-2)}
.store-rarity.rare{color:var(--violet-2);border-color:rgba(167,139,250,.45);background:rgba(124,58,237,.14)}
.store-rarity.epic{color:#f0abfc;border-color:rgba(240,171,252,.45);background:rgba(192,38,211,.12)}

.store-buy b{font-family:var(--serif);font-size:17px;color:var(--silver)}
.store-buy small{color:var(--violet-2)}
.store-buy .btn{min-height:38px;padding:8px 12px;font-size:13px}
.store-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.store-plan{margin:0;display:flex;flex-direction:column;gap:6px}
.store-plan h3{margin:6px 0 0}
.store-plan p{color:var(--muted);margin:0}
.store-plan ul{margin:6px 0 10px;padding-left:18px;color:#d6d0e2;font-size:14px}

.store-price{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--silver)}
.store-price small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.store-plan .btn{margin-top:auto}

/* ---------- toast (aviso rápido) ---------- */
.toast{
  position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:120;max-width:92%;
  padding:13px 18px;border-radius:16px;text-align:center;font-weight:600;color:var(--text);
  background:rgba(12,8,20,.94);border:1px solid rgba(167,139,250,.45);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(124,58,237,.25);

/* ---------- lista de servidores ---------- */
.pv-list{display:grid;gap:10px}
.pv-server{display:flex;align-items:center;gap:14px;padding:14px;margin:0}
.pv-server.on{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 1px rgba(167,139,250,.25),0 18px 50px rgba(0,0,0,.42)}
.pv-server-i{flex:1;min-width:0}
.pv-server-i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-server-i small{display:block;color:var(--muted)}
.pv-server .btn{flex:0 0 auto;min-width:120px}

/* ---------- seletor de servidor e saudação ---------- */
.pv-switch{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px}
.pv-switch-l{flex:1;min-width:220px;display:grid;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--silver-2)}
.pv-greet{display:flex;align-items:center;justify-content:space-between;gap:16px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 92% 0%,rgba(124,58,237,.42),transparent 45%),linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.01))}
.pv-greet h2{margin:0 0 4px}
.pv-greet p{margin:0;color:var(--muted)}
.pv-mascot{font-size:64px;filter:drop-shadow(0 0 22px var(--glow));flex:0 0 auto}

/* ---------- estatísticas ---------- */
.pv-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.pv-stat{margin:0;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pv-stat small{color:var(--muted);font-size:12px;letter-spacing:.03em;text-transform:uppercase;font-weight:700}
.pv-stat b{font-family:var(--serif);font-size:28px;color:var(--silver);line-height:1.1;margin-top:4px}
.pv-stat-ic{font-size:20px;margin-bottom:4px}
.pv-stat:first-child b{background:linear-gradient(90deg,#fff,var(--violet-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- acesso rápido ---------- */
.pv-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:6px}
.pv-q{margin:0;padding:18px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--text);font:inherit;border:1px solid var(--line)}
.pv-q span{font-size:26px;filter:drop-shadow(0 0 10px rgba(167,139,250,.5))}
.pv-q b{font-size:14.5px}
.pv-q:hover{border-color:rgba(167,139,250,.55);background:rgba(124,58,237,.12)}

/* ---------- funções (cartões de recurso) ---------- */
.pv-fn{padding:16px}
.pv-fn-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pv-fn-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;
  background:linear-gradient(145deg,rgba(124,58,237,.35),rgba(255,255,255,.04));border:1px solid rgba(167,139,250,.35)}
.pv-fn-t{flex:1;min-width:0;display:grid}
.pv-fn-t b{font-size:16px}
.pv-fn-t small{color:var(--muted)}
.pv-fn .btn{width:100%}

/* ---------- painéis de cargos ---------- */
.pv-panel{padding:16px}
.pv-panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.pv-panel-h b{font-family:var(--serif);font-size:18px}
.pv-chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.pv-chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(124,58,237,.14);border:1px solid rgba(167,139,250,.3);color:#ede9fe}
.pv-panel .pv-actions{margin-top:6px}

/* ---------- formulários e modais ---------- */
.pv-form{display:block}
.pv-form .label{margin-top:12px}
.pv-form .pv-actions{margin-top:18px}
.pv-check{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:var(--text);cursor:pointer;margin:6px 0}
.pv-roles{display:grid;gap:10px;margin:8px 0}
.pv-role{padding:12px;border-radius:15px;background:var(--glass);border:1px solid var(--line)}
.pv-role .pv-check{margin:0}
.pv-role-f{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.pv-swatch{display:inline-block;width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.12);flex:0 0 auto}
.pv-modal{position:fixed;inset:0;z-index:90;background:rgba(2,1,5,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pv-modal-b{display:flex;justify-content:center;padding:16px;min-height:100%}
.pv-modal-c{
  width:min(640px,100%);align-self:flex-start;margin:24px 0;padding:22px;border-radius:24px;
  background:radial-gradient(circle at 100% 0%,rgba(124,58,237,.28),transparent 42%),linear-gradient(180deg,#120c1e,#07050c);
  border:1px solid var(--line-2);box-shadow:0 30px 90px rgba(0,0,0,.7);
}
.pv-modal-c .label{font-size:13px}
.pv-modal-c .pv-actions{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#07050c 35%);padding-top:14px}

/* ---------- diagnóstico ---------- */
.pv-dg{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;margin:0;border-left:3px solid var(--line-2)}
.pv-dg>span{font-size:19px;line-height:1.3}
.pv-dg b{display:block}
.pv-dg small{display:block;color:var(--muted);margin-top:2px}
.pv-dg.ok{border-left-color:var(--ok)}
.pv-dg.aviso{border-left-color:var(--warn)}
.pv-dg.erro{border-left-color:var(--danger)}

/* ---------- tela inicial (sem login) ---------- */
.hero{
  position:relative;overflow:hidden;padding:34px 24px;border-radius:28px;margin:0 0 22px;
  background:radial-gradient(circle at 85% 0%,rgba(124,58,237,.45),transparent 48%),radial-gradient(circle at 0% 100%,rgba(203,213,225,.08),transparent 45%),linear-gradient(160deg,#130c22,#060409 70%);
  border:1px solid var(--line-2);box-shadow:0 30px 90px rgba(0,0,0,.6);
}
.hero h1{font-family:var(--serif);font-size:clamp(28px,6.4vw,50px);letter-spacing:-.01em;line-height:1.08;margin:12px 0 14px;
  background:linear-gradient(180deg,#ffffff,#c9cdd9 55%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:620px}
.kicker{display:block;font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--violet-2);text-transform:uppercase}
.hero .nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.pv-landing{padding:30px 24px 28px}
.pv-landing-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:18px}
.pv-wordmark{font-family:var(--serif);font-size:clamp(30px,8.4vw,58px);font-weight:700;letter-spacing:.12em;line-height:1;background:linear-gradient(180deg,#ffffff,#d8c4ff 60%,#9d7bf0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(168,120,255,.35))}
.pv-submark{font-family:var(--serif);font-size:clamp(14px,3.6vw,22px);letter-spacing:.55em;color:var(--violet-2);font-weight:600;margin-top:-4px;padding-left:.55em}
.pv-tagline{font-family:var(--serif);font-style:italic;font-size:clamp(16px,4vw,20px);color:var(--silver);margin:8px 0 4px;text-align:center}
.pv-landing-copy{font-size:15.5px;color:#c9c3d6;max-width:620px;margin:6px auto 0;text-align:center}
.pv-landing .nav{justify-content:center}
.pv-landing-foot{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--silver-2)}
.pv-home-intro{margin:30px 0 14px}
.pv-home-label{display:block;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--violet-2);margin-bottom:4px}
.pv-home-intro p{margin:4px 0 0}
.pv-feature-grid{grid-template-columns:1fr}
.pv-feature{padding:20px}
.pv-feature h3{margin:6px 0 4px}
.pv-feature p{color:var(--muted);margin:0}
.pv-feature-icon{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(145deg,rgba(124,58,237,.4),rgba(255,255,255,.04));border:1px solid rgba(167,139,250,.35);box-shadow:0 0 24px rgba(124,58,237,.25)}

/* ---------- loja Tenkhyrons (visual de apresentação) ---------- */
.store-hero{text-align:center;padding:30px 22px;background:radial-gradient(circle at 90% 10%,rgba(124,58,237,.35),transparent 45%),linear-gradient(145deg,#15101f,#07050c);border-color:rgba(167,139,250,.4)}
.store-mark{font-size:44px;filter:drop-shadow(0 0 18px var(--violet))}
.store-kicker{display:block;color:var(--violet-2);font-size:11px;letter-spacing:.24em;font-weight:700;margin:6px 0}
.store-balance{display:grid;gap:4px;justify-items:center;margin-top:18px;padding:14px;border-radius:16px;background:rgba(4,3,7,.5);border:1px solid var(--line)}
.store-balance span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.store-balance b{font-family:var(--serif);font-size:20px;color:var(--silver)}
.store-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.store-section-head h2{margin:2px 0 0}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.store-item{margin:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.store-item p{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.store-item h3{margin:6px 0 0;font-size:17px}
.store-art{width:100%;height:86px;border-radius:16px;display:grid;place-items:center;font-size:36px;color:var(--silver);
  background:radial-gradient(circle at 50% 30%,rgba(167,139,250,.35),transparent 60%),rgba(4,3,7,.6);border:1px solid var(--line);margin-bottom:4px}
.store-art.crystal{color:var(--violet-2)}
.store-art.crest,.store-art.relic-art{color:var(--silver)}
.store-art.title-art{color:var(--violet-2)}
.store-art.frame-art{color:#e9d5ff}
.store-art.crown-art{color:#f5f3ff;filter:drop-shadow(0 0 12px rgba(196,181,253,.8))}
.store-art.potion-art{color:#f0abfc}
.store-rarity{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--silver)}
.store-rarity.common{color:var(--silver-2)}
.store-rarity.rare{color:var(--violet-2);border-color:rgba(167,139,250,.45);background:rgba(124,58,237,.14)}
.store-rarity.epic{color:#f0abfc;border-color:rgba(240,171,252,.45);background:rgba(192,38,211,.12)}
.store-rarity.legendary{color:#fff;border-color:rgba(255,255,255,.6);background:linear-gradient(90deg,rgba(203,213,225,.2),rgba(124,58,237,.3));box-shadow:0 0 18px rgba(196,181,253,.35)}
.store-buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.store-buy b{font-family:var(--serif);font-size:17px;color:var(--silver)}
.store-buy small{color:var(--violet-2)}
.store-buy .btn{min-height:38px;padding:8px 12px;font-size:13px}
.store-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.store-plan{margin:0;display:flex;flex-direction:column;gap:6px}
.store-plan h3{margin:6px 0 0}
.store-plan p{color:var(--muted);margin:0}
.store-plan ul{margin:6px 0 10px;padding-left:18px;color:#d6d0e2;font-size:14px}
.store-plan.featured{border-color:rgba(167,139,250,.6);box-shadow:0 0 0 1px rgba(167,139,250,.3),0 26px 70px rgba(124,58,237,.3)}
.store-price{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--silver)}
.store-price small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.store-plan .btn{margin-top:auto}

/* ---------- toast (aviso rápido) ---------- */
.toast{
  position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:120;max-width:92%;
  padding:13px 18px;border-radius:16px;text-align:center;font-weight:600;color:var(--text);
  background:rgba(12,8,20,.94);border:1px solid rgba(167,139,250,.45);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(124,58,237,.25);
  animation:pvIn .24s ease both;
}

/* ---------- desktop: menu lateral fixo ---------- */
@media (min-width:980px){
  .pv-side{transform:none;box-shadow:none;z-index:45;width:300px}
  .pv-ham,.pv-bottom,.pv-x,.pv-overlay{display:none}
  .pv-top{left:300px;padding-left:26px}
  body .wrap{margin-left:320px;margin-right:auto;max-width:1100px;padding:96px 28px 48px}
  .pv-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pv-feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pv-landing{padding:44px 44px 40px}
  .pv-quick{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pv-role-f{grid-template-columns:1fr 1fr 1fr}
}

/* ---------- celular e tablet pequeno ---------- */
@media (max-width:979px){
  body .wrap{padding:84px 14px 128px}
  .pv-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pv-quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pv-brand small{display:none}
}
@media (max-width:640px){
  .pv-greet h2{font-size:24px}
  .pv-mascot{font-size:52px}
  .hero{padding:24px 18px;border-radius:22px}
  .hero .nav .btn,.pv-landing .nav .btn{width:100%}
  .pv-cta{width:100%}
  .pv-bat{width:70px;height:70px;font-size:32px}
  .pv-landing-brand{gap:10px;margin-bottom:14px}
  .pv-landing-foot{gap:10px;font-size:9.5px;letter-spacing:.1em}
  .pv-server{flex-wrap:wrap}
  .pv-server .btn{width:100%;min-width:0}
  .pv-switch{flex-direction:column;align-items:stretch}
  .pv-bot{font-size:13px}
  .pv-bar{flex-wrap:wrap}
  .pv-bar .btn{width:100%}
  .pv-fn-top .btn{margin-left:0}
  .pv-modal-b{padding:10px}
  .pv-modal-c{padding:18px;border-radius:20px;margin:10px 0}
  .pv-lang-select{max-width:132px;font-size:11.5px}
  .pv-language{padding:10px 8px}
  .store-grid{grid-template-columns:1fr 1fr}
  .toast{top:70px}
  .pv-stat b{font-size:24px}
}
@media (max-width:360px){
  .pv-quick{grid-template-columns:1fr}
  .store-grid{grid-template-columns:1fr}
  .pv-bottom button{font-size:10.5px}
}

/* ---------- movimento reduzido (acessibilidade) ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* ---------- painel do servidor: banner, colunas e cartões laterais ---------- */
.pv-dash-banner{
  display:flex;flex-direction:column;gap:14px;padding:22px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 100% 0%,rgba(124,58,237,.42),transparent 46%),radial-gradient(circle at 0% 100%,rgba(203,213,225,.07),transparent 40%),linear-gradient(150deg,#140d24,#06040b 75%);
  border-color:rgba(167,139,250,.35);
}
.pv-banner-id{display:flex;align-items:center;gap:16px;min-width:0}
.pv-banner-id h2{margin:4px 0 6px;overflow-wrap:anywhere}
.pv-gi-lg{width:68px;height:68px;border-radius:20px;font-size:27px}
.pv-dash{display:grid;gap:16px;align-items:start}
.pv-dash-main{min-width:0}
.pv-dash-side{display:grid;gap:14px;min-width:0}
.pv-profile{display:flex;align-items:center;gap:14px;margin:0}
.pv-profile .pv-av{width:52px;height:52px}
.pv-profile b{display:block;overflow-wrap:anywhere}
.pv-side-card{margin:0;padding:16px}
.pv-side-card p{margin:6px 0 0}
.pv-side-card .kicker{margin-bottom:6px}
.pv-dash .pv-quick{margin-bottom:18px}
@media (min-width:980px){
  .pv-dash{grid-template-columns:minmax(0,1fr) 320px}
  .pv-dash-banner{flex-direction:row;align-items:center;justify-content:space-between}
  .pv-dash-banner .pv-actions{margin-top:0;flex:0 0 auto}
  .pv-dash-banner .pv-actions .btn{flex:0 0 auto}
}

/* ---------- toques góticos (ornamentos originais em CSS) ---------- */
.hero::after,.pv-dash-banner::after{
  content:&quot;&quot;;position:absolute;right:-36px;top:-36px;width:180px;height:180px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(216,196,255,.22),rgba(124,58,237,.10) 45%,transparent 70%);
}
.pv-dash-banner::before{
  content:&quot;&quot;;position:absolute;inset:auto 18px 10px auto;width:86px;height:14px;pointer-events:none;opacity:.55;
  background:
    radial-gradient(circle at 6px 6px,rgba(216,196,255,.7) 0 2px,transparent 3px),
    linear-gradient(90deg,transparent,rgba(196,181,253,.35) 30%,rgba(196,181,253,.35) 70%,transparent);
  background-size:14px 14px,100% 1px;background-repeat:repeat-x,no-repeat;background-position:0 0,0 6px;
}
.kicker::before{content:&quot;✦ &quot;;color:var(--violet-2)}
.btn.primary{box-shadow:0 10px 30px rgba(124,58,237,.42),inset 0 1px 0 rgba(255,255,255,.18)}

/* ---------- morcego do logo: quadrado com a mesma moldura do botão ☰ ---------- */
.pv-bat-sq{width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(145deg,rgba(124,58,237,.30),rgba(4,3,7,.6));border:1px solid var(--line-2);box-shadow:0 0 18px rgba(124,58,237,.28)}
.pv-bat-sq svg{width:26px;height:26px;fill:var(--violet-2);filter:drop-shadow(0 0 6px var(--glow))}
.pv-side-h .pv-bat-sq{width:40px;height:40px;border-radius:12px}
.pv-side-h .pv-bat-sq svg{width:24px;height:24px}
</style>
