services:
  - type: web
    name: tenchikho-qg
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LEADER_ROLE_ID
        value: "1554983934775922819"
      - key: SUBLEADER_ROLE_ID
        value: "1551318428747305020"
