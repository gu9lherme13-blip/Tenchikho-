<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tenchikho • Central de Chamadas</title>
<style>
:root{color-scheme:dark;--bg:#08080d;--panel:#12121b;--line:#292638;--purple:#8055c7;--muted:#a6a1b4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21152e 0,#08080d 55%);color:#f5f2fa;font:15px system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:28px 16px}.top{margin-bottom:22px}.eyebrow{color:#b99ae8;letter-spacing:.18em;font-size:11px;font-weight:700}
h1{font-size:clamp(25px,5vw,38px);margin:7px 0}.sub{color:var(--muted)}
.panel{background:#11111bd9;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 12px 40px #0005}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;color:#c9c3d5;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;background:#090910;border:1px solid #373246;color:white;border-radius:10px;padding:12px;font:inherit}
textarea{min-height:76px;resize:vertical}.wide{grid-column:1/-1}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--purple);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#292536;border:1px solid #49415b}button:disabled{opacity:.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}
.muted{color:var(--muted);font-size:13px}.pill{border:1px solid #59457a;color:#cdb7f0;padding:4px 8px;border-radius:99px;font-size:11px}
.names{margin-top:8px;color:#ded8e9;line-height:1.7;overflow-wrap:anywhere}
#message{margin:10px 0;color:#d6c2fa;white-space:pre-wrap}
@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:14px}}
</style></head>
<body><main>
<header class="top"><div class="eyebrow">TENCHIKHO / PAINEL</div><h1>Central de Chamadas</h1><div class="sub">Crie chamadas, acompanhe confirmações e consulte o histórico.</div></header>
<section class="panel">
<div class="row"><h2>Nova chamada</h2><span class="pill" id="bot">Verificando bot…</span></div>
<div class="grid">
<div><label for="key">Chave do painel</label><input id="key" type="password" placeholder="Chave configurada no servidor"></div>
<div><label for="title">Título da chamada</label><input id="title" maxlength="100" placeholder="Ex.: Chamada geral"></div>
<div><label for="channel">Canal do Discord</label><select id="channel"><option value="">Carregue os canais</option></select></div>
<div><label for="duration">Duração (minutos)</label><input id="duration" type="number" min="1" max="10080" value="30"></div>
<div class="wide"><label for="notice">Aviso (opcional)</label><textarea id="notice" placeholder="Mensagem que acompanhará a chamada"></textarea></div>
</div><div class="row" style="margin-top:14px"><button id="create">Abrir chamada</button><button class="secondary" id="refresh">Atualizar painel</button></div><div id="message"></div>
</section>
<section class="panel"><h2>Chamadas abertas</h2><div id="open" class="muted">Carregue o painel para ver as chamadas.</div></section>
<section class="panel"><h2>Histórico</h2><div id="history" class="muted">Sem dados carregados.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let data={};
function headers(){return {'Content-Type':'application/json','x-panel-key':$('key').value}}
async function api(url,opts={}){const r=await fetch('/api'+url,{...opts,headers:{...headers(),...(opts.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha na solicitação');return j}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(items,closed=false){if(!items.length)return '<p class="muted">Nenhuma chamada.</p>';return items.map(c=>`<div class="item"><div class="row"><strong>${escapeHtml(c.title)}</strong><span class="pill">${closed?'Encerrada':'Aberta'}</span></div><div class="muted">${closed?'Encerrada':'Encerra'}: ${new Date(closed?c.closedAt:c.closesAt).toLocaleString('pt-BR')} · ${c.members.length} presença(s)</div><div class="names">${c.members.length?c.members.map(m=>escapeHtml(m.name)).join(' • '):'Ninguém confirmou ainda.'}</div>${closed?'':`<div style="margin-top:10px"><button class="secondary" onclick="closeCall('${c.id}')">Encerrar chamada</button></div>`}</div>`).join('')}
async function refresh(){try{data=await api('/status');$('bot').textContent=data.bot?'Bot conectado':'Bot desconectado';$('channel').innerHTML='<option value="">Selecione um canal</option>'+data.channels.map(c=>`<option value="${c.id}">#${escapeHtml(c.name)} — ${escapeHtml(c.guildId)}</option>`).join('');$('open').innerHTML=renderList(data.open);$('history').innerHTML=renderList(data.history,true);$('message').textContent='Painel atualizado.'}catch(e){$('message').textContent=e.message}}
async function closeCall(id){try{await api(`/calls/${id}/close`,{method:'POST'});await refresh()}catch(e){$('message').textContent=e.message}}
$('create').onclick=async()=>{try{const result=await api('/calls',{method:'POST',body:JSON.stringify({title:$('title').value,channelId:$('channel').value,durationMinutes:Number($('duration').value),notice:$('notice').value})});$('message').textContent='Chamada aberta e aviso enviado ao Discord.';$('title').value='';$('notice').value='';await refresh()}catch(e){$('message').textContent=e.message}};
$('refresh').onclick=refresh;
</script></body></html>
