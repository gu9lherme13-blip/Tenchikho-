<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recrutamento - Tenchikho</title>
<style>
:root{--verde:#22c55e;--card:#0c110e;--campo:#1a1d1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:center;padding:16px 18px;border-bottom:1px solid #14532d}
h1{margin:0;font-size:20px;letter-spacing:4px}
main{max-width:560px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1.5px solid var(--verde);border-radius:24px;padding:22px;margin-top:10px}
h2{margin:0 0 6px;font-size:22px}
p.ajuda{margin:0 0 16px;font-size:14px;color:#9ca3af;line-height:1.5}
label{display:block;font-size:14px;color:var(--verde);margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #14532d;background:var(--campo);color:#fff;font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.btn{display:block;width:100%;padding:14px;border-radius:999px;border:0;background:var(--verde);color:#fff;font-size:17px;font-weight:700;margin-top:18px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.msg{margin-top:14px;font-size:15px;line-height:1.5;color:#bbf7d0}
.msg.erro{color:#fecaca}
.oculto{display:none !important}
</style>
</head>
<body>
<header><h1>TENCHIKHO</h1></header>
<main>
  <section class="card">
    <h2 id="titulo">Recrutamento</h2>
    <p class="ajuda" id="intro">Carregando...</p>

    <div id="semLogin" class="oculto">
      <p class="ajuda">Para enviar a candidatura, entre com o Discord. Assim o bot consegue avisar você do resultado.</p>
      <a class="btn" href="/auth/login">Entrar com Discord</a>
    </div>

    <form id="formulario" class="oculto" autocomplete="off">
      <div id="campos"></div>
      <button class="btn" id="enviar" type="submit">Enviar candidatura</button>
      <p class="msg" id="msg"></p>
    </form>

    <p class="msg oculto" id="fechado">O recrutamento está fechado no momento.</p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function mostrarMsg(t, erro) { const m = $('msg'); m.textContent = t; m.className = 'msg' + (erro ? ' erro' : ''); }

const CONFIG_CAMPOS = {
  experiencia: { tipo: 'area' },
  jaParticipou: { tipo: 'area' },
  motivo: { tipo: 'area' },
};

async function iniciar() {
  const cfg = await fetch('/api/recrutamento/publico').then(r => r.json());
  if (!cfg.aberto) {
    $('intro').textContent = '';
    $('fechado').classList.remove('oculto');
    return;
  }
  $('intro').textContent = `Candidate-se para a equipe de ${cfg.servidorNome}. Responda com sinceridade.`;

  const me = await fetch('/api/me').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!me || !me.user) {
    $('semLogin').classList.remove('oculto');
    return;
  }

  $('campos').innerHTML = cfg.perguntas.map(p => {
    const area = CONFIG_CAMPOS[p.campo]?.tipo === 'area';
    const valorInicial = p.campo === 'nomeDiscord' ? (me.user.nome || me.user.username || '') : '';
    const input = area
      ? `<textarea name="${p.campo}" maxlength="${p.max}"></textarea>`
      : `<input name="${p.campo}" maxlength="${p.max}" value="${esc(valorInicial)}">`;
    return `<label>${esc(p.rotulo)}</label>${input}`;
  }).join('');
  $('formulario').classList.remove('oculto');
}

$('formulario').addEventListener('submit', async e => {
  e.preventDefault();
  const dados = Object.fromEntries(new FormData($('formulario')).entries());
  $('enviar').disabled = true;
  mostrarMsg('Enviando...');
  try {
    const r = await fetch('/api/recrutamento/enviar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Não foi possível enviar.');
    $('formulario').classList.add('oculto');
    mostrarMsg('Candidatura enviada! A equipe vai analisar e o resultado chega por mensagem privada no Discord.');
  } catch (err) {
    mostrarMsg(err.message, true);
    $('enviar').disabled = false;
  }
});

iniciar().catch(() => { $('intro').textContent = 'Não consegui carregar o formulário. Tente de novo em instantes.'; });
</script>
</body>
</html>
